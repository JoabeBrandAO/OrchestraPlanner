version: 2

# Atualização de dependências (#69). Antes disto, a única forma de uma correção de
# segurança chegar aqui era alguém lembrar de rodar `npm audit` — e ninguém lembrava:
# a auditoria de 2026-09-04 encontrou 13 falhas em dependências de produção, 10 delas altas.
#
# Com merge autônomo e CI verde exigido, um PR de patch entra sozinho; o que exigir decisão
# (major, ou minor que quebre a suíte) fica aberto esperando o dono.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["ci", "security"]
    commit-message:
      prefix: "chore(deps)"
    # Majors recusadas com motivo (2026-09-30). Tirar daqui quando o motivo cair.
    ignore:
      # typescript-eslint não suporta TS 7 (#90).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react quebra no ESLint 10: `getFilename is not a function` (#87).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Os tipos seguem o runtime: produção e CI rodam Node 22 (#86).
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      # Patch e minor num PR só: dez PRs por semana viram ruído, e ruído não se lê.
      # Major vem separado, porque cada um é uma decisão.
      rotina:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # As actions dos workflows também são dependência — e rodam com acesso aos segredos.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["ci"]
    commit-message:
      prefix: "chore(ci)"
